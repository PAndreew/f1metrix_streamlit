name: Tests
on:
  push:
    paths-ignore: ["publication/**"]
  pull_request:
permissions:
  contents: read
jobs:
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r model/requirements.txt pytest
      - run: python -m pytest tests/test_model_integration.py -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 pytest
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck && npm run build && npm run build:site
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          npm run dev:site -- --port 5178 > /tmp/f1metrix-site.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5178 >/dev/null && break || sleep 1; done
          node tests/browser-smoke.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
