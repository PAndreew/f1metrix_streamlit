name: F1DB watcher and publication
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refit even if source release is unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: f1metrix-publication
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.watch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          req=urllib.request.Request('https://api.github.com/repos/f1db/f1db/releases/latest', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'f1metrix'})
          release=json.load(urllib.request.urlopen(req,timeout=30))
          p=Path('publication/state.json')
          state=json.loads(p.read_text()) if p.exists() else {}
          changed=state.get('tag') != release['tag_name'] or os.getenv('FORCE')=='true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('changed='+str(changed).lower()+'\n')
          print('Source release:',release['tag_name'],'changed:',changed)
          PY
  publish:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      F1METRIX_LLM_MODEL: ${{ vars.F1METRIX_LLM_MODEL }}
      F1METRIX_FIT_TIMEOUT: '8500'
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Check credentials before installing or sampling
        run: test -n "$OPENROUTER_API_KEY" && test -n "$F1METRIX_LLM_MODEL"
      - run: pip install -r model/requirements.txt pytest
      - run: python -m pytest tests
      - name: Fit, reconstruct held-out forecast, generate validated article
        run: python -m pipeline.run --force
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build:site
      - name: Commit a complete publication
        run: |
          git config user.name 'F1 Metrix publication bot'
          git config user.email 'publication@users.noreply.github.com'
          git add publication
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated F1DB model and AI race analysis'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Optional Vercel deployment hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --max-time 60 -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-provenance-${{ github.run_id }}
          path: .pipeline/last-run.json
          if-no-files-found: ignore
          retention-days: 30
